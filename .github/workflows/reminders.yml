# Daily Weekly Plan reminders — runs on GitHub's own servers, completely
# separate from Firebase. No Blaze plan, no Power Automate, nothing else
# needed beyond what's set up in this repo's Settings → Secrets.
#
# This file belongs at: .github/workflows/reminders.yml
# (GitHub only recognises workflow files in that exact folder.)

name: Daily meeting-plan reminders

on:
  schedule:
    # 02:30 UTC = 08:00 IST, every day. GitHub Actions cron is always UTC —
    # there is no timezone setting to change instead of doing this math.
    - cron: "30 2 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab, for testing

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: reminders
        run: npm install

      - name: Send today's digests
        working-directory: reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node send-reminders.js
